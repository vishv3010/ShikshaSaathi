# Render blueprint: one free web service, deployed from this GitHub repository.
# Steps: docs/DEPLOY.md. Render asks for GEMINI_API_KEY when the blueprint is applied
# (the key is never stored in this file). Without a key the app runs on rules only.
services:
  - type: web
    name: shiksha-saathi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn saathi.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false
