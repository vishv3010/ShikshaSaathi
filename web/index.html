<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<title>Shiksha Saathi</title>
<style>
  /* One bold thing: this week's plan on a school blackboard; everything around it is quiet paper (D-032).
     Colour only for meaning, AA contrast in both themes; em sizes so Gujarati/Hindi can be 6% larger. */
  :root {
    --bg: #f4f6f5; --surface: #fff; --text: #15241f; --muted: #55645e; --border: #dde4e1; --line: #7f8d87; --soft: #e9efec;
    --accent: #1e4b3e; --accent-ink: #fff; --accent-soft: #e2ede8; --accent-text: #1e4b3e;
    --board: #1e4b3e; --chalk: #f4f2ea; --chalk-2: #cbd8d1; --chalk-line: #33604f; --gold: #f1d38a;
    --high: #c8321f; --high-text: #a3261a; --high-soft: #fbe5e1;
    --med: #c98100; --med-text: #7a4300; --med-soft: #fdedcc;
    --low: #2f855a; --low-text: #22693f; --low-soft: #e3f3e9;
    --do-bg: #e9f2ee; --do-edge: #1e4b3e; --do-text: #15322a;
    --s: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1412; --surface: #141d1a; --text: #e5ece8; --muted: #9fb0a8; --border: #24312c; --line: #6a7c74; --soft: #1b2723;
      --accent: #8fd3b6; --accent-ink: #0d1412; --accent-soft: #16302a; --accent-text: #a8e0c8; --board: #1b4437; --chalk-line: #2f5a4b;
      --high: #f87171; --high-text: #fca5a5; --high-soft: #3a1717; --med: #fbbf24; --med-text: #fcd34d; --med-soft: #3a2a0c;
      --low: #34d399; --low-text: #6ee7b7; --low-soft: #0f2f24; --do-bg: #13261f; --do-edge: #8fd3b6; --do-text: #d5f5ee;
    }
  }
  :lang(gu), :lang(hi) { --s: 1.0625; }
  :lang(en) { --s: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
         font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Gujarati", "Noto Sans Devanagari", sans-serif; }
  button, select, textarea { font: inherit; color: inherit; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--board); color: var(--chalk);
          display: grid; place-items: center; flex: none; }
  .brand { flex: 1; min-width: 0; line-height: 1.25; }
  .brand h1 { font-size: 17px; font-weight: 800; margin: 0; }
  .brand span { font-size: 13px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick { position: relative; flex: none; display: flex; align-items: center; color: var(--muted); }
  .pick svg { position: absolute; pointer-events: none; } .pick svg:first-child { left: 12px; } .pick svg:last-child { right: 11px; }
  .pick select { appearance: none; -webkit-appearance: none; field-sizing: content; font-size: 14px; font-weight: 600; height: 44px;
                 padding: 0 30px 0 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
  @media (max-width: 359px) { .logo { display: none; } }
  main { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
  #home, .q, .a { font-size: calc(1rem * var(--s)); }
  .hello { font-size: 1.75em; font-weight: 800; line-height: 1.2; margin: .4em 0 .15em; }
  .hello:lang(en), .hero h3:lang(en) { letter-spacing: -.015em; }
  .lede { color: var(--muted); margin: 0 0 1.1em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .hero { background: var(--board); color: var(--chalk); border: 0; border-radius: 18px; padding: 18px 16px 18px;
          box-shadow: inset 0 -6px 0 var(--chalk-line); }
  .hero :focus-visible { outline-color: var(--chalk); }
  .overline { font-size: .875em; font-weight: 700; color: var(--gold); margin: 0; }
  .hero h3 { font-size: 1.375em; font-weight: 800; line-height: 1.25; margin: .15em 0 .5em; }
  .row, .ex { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--border);
              background: none; text-align: left; cursor: pointer; }
  .row { margin: 0 -16px; width: calc(100% + 32px); padding: 12px 16px; border-top-color: var(--chalk-line); }
  .row:first-of-type, .ex:first-child { border-top: 0; }
  .row:active { background: var(--chalk-line); } .ex:active { background: var(--soft); }
  .grow { flex: 1; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; }
  .row b { font-size: 1.0625em; }
  .row small { display: block; color: var(--chalk-2); font-size: .875em; margin-top: 2px; }
  .chev { color: var(--muted); flex: none; display: flex; } .hero .chev { color: var(--chalk-2); }
  .num { width: 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center;
         font-size: .8125em; font-weight: 800; flex: none; }
  .hero .num { background: var(--chalk-line); border-radius: 50%; }
  .tag { font-size: .8125em; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--high-soft);
         color: var(--high-text); white-space: nowrap; }
  .tag.Medium { background: var(--med-soft); color: var(--med-text); } .tag.Low { background: var(--low-soft); color: var(--low-text); }
  .btn { font-weight: 700; display: block; width: 100%; margin-top: 14px; padding: 12px 16px; border: 0; border-radius: 12px;
         background: var(--chalk); color: var(--board); cursor: pointer; min-height: 48px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; padding: 0; background: none; border: 0; }
  .stats div { padding: 0 12px; } .stats div:first-child { padding-left: 2px; } .stats div + div { border-left: 1px solid var(--border); }
  .stats b { display: block; font-size: 2em; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stats span { display: block; font-size: .875em; color: var(--muted); line-height: 1.3; margin-top: 4px; }
  .stats .high { color: var(--high-text); } .stats .med { color: var(--med-text); }
  .wait { min-height: 420px; } .skel { height: 14px; border-radius: 7px; background: var(--chalk-line); margin: 14px 0; }
  .skel:nth-child(odd) { width: 60%; }
  .section { font-size: .9375em; font-weight: 700; margin: 26px 0 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-height: 96px; }
  .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text);
         display: grid; place-items: center; }
  .tile b { font-weight: 700; font-size: .9375em; line-height: 1.3; }
  .list { padding: 0; overflow: hidden; }
  .ex { min-height: 52px; padding: 12px 16px; } .ex span:first-child { flex: 1; }
  .trust { font-size: .8125em; color: var(--muted); text-align: center; margin: 22px 0 4px; }
  .q { display: flex; justify-content: flex-end; margin: 28px 0 12px; }
  .q span { background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 18px 18px 4px 18px;
            max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { overflow-wrap: anywhere; }
  .a p { margin: 0 0 8px; }
  .a .lead { font-size: 1.0625em; margin-bottom: 14px; }
  .sub { color: var(--muted); font-size: .875em; }
  .headline, .subhead, .item { font-weight: 700; }
  .a .subhead, .a .item { margin-top: 14px; }
  .indent { padding-left: 14px; }
  .a ul { margin: 0 0 10px; padding-left: 20px; } .a li { margin: 4px 0; }
  .do { background: var(--do-bg); border-left: 3px solid var(--do-edge); color: var(--do-text); border-radius: 10px;
        padding: 10px 12px; margin: 10px 0; }
  .do b { display: block; font-size: .8125em; margin-bottom: 2px; }
  .school { margin: 12px 0; border-left: 5px solid var(--high); }
  .school.Medium { border-left-color: var(--med); } .school.Low { border-left-color: var(--low); }
  .school-head { display: flex; align-items: center; gap: 10px; }
  .school h3 { font-size: 1.125em; font-weight: 800; flex: 1; min-width: 0; margin: 0; }
  .meter { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; font-size: .8125em; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--high); border-radius: 99px; }
  .Medium .bar i { background: var(--med); } .Low .bar i { background: var(--low); }
  .a .label { font-size: .8125em; font-weight: 700; color: var(--muted); margin: 6px 0 2px; }
  .last { font-size: .875em; color: var(--muted); }
  .note { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .note b { display: block; margin-bottom: 4px; }
  .a .meta, .meta { font-size: .8125em; color: var(--muted); margin: 10px 0 0; }
  .meta.warn { color: var(--med-text); } .meta.bad { color: var(--high-text); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip { font-size: .875em; background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
          padding: 8px 16px; min-height: 44px; cursor: pointer; text-align: left; }
  .chip.ghost { color: var(--muted); }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .875em; padding: 6px 0; }
  .dots { display: inline-flex; gap: 5px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
  .btn:active, .tile:active, .chip:active, .send:active { transform: scale(.985); }
  footer { padding: 10px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border); }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px;
             resize: none; max-height: 120px; min-height: 48px; }
  textarea::placeholder { color: var(--muted); opacity: 1; }
  .send { width: 48px; height: 48px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
          cursor: pointer; flex: none; display: grid; place-items: center; }
  .send:disabled { opacity: .5; }
  [aria-disabled=true] { opacity: .65; pointer-events: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  details.review { font-size: 13px; color: var(--muted); margin-top: 4px; }
  details.review summary { cursor: pointer; padding: 3px 0; }
  details.review .rv { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding-top: 4px; }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
  </div>
  <div class="brand"><h1 lang="en">Shiksha Saathi</h1><span id="sub"></span></div>

  </div>
</header>

<main id="chat">
  <section id="home"></section>
  <section class="thread" id="thread" role="log" aria-live="polite"></section>
</main>

<footer>
  <form id="form">
    <label class="sr" for="q" id="qlabel">Your question</label>
    <textarea id="q" rows="1" maxlength="500" autocomplete="off"></textarea>

  <!-- Reviewer tools, folded away; ?test=1 or ?review=1 opens them. -->

      <label title="Adds a made-up figure (99.9%) to the AI's text, to show the number checker catching it">
        <input type="checkbox" id="test"> Test the number checker
      </label>
      <span id="status"></span>
    </div>
  </details>
</footer>
</div>

    rejectedNum: (x) => "AIએ એવો આંકડો (" + x + ") લખ્યો જે રેકોર્ડમાં નથી, તેથી તેનું લખાણ કાઢી નાખ્યું. આ જવાબ સીધો રેકોર્ડમાંથી છે.",
    rejectedOther: "AIનું લખાણ ચકાસણીમાં પાસ ન થયું, તેથી આ જવાબ સીધો રેકોર્ડમાંથી છે.",
    unavailable: "AI હમણાં ઉપલબ્ધ નથી, તેથી આ જવાબ સીધો રેકોર્ડમાંથી છે.",
    paused: "હમણાં ઘણા પ્રશ્નો છે, તેથી આ જવાબ સીધો રેકોર્ડમાંથી છે.",
    tooMany: "એક મિનિટમાં ઘણા પ્રશ્નો થયા. થોડી વાર રાહ જોઈને ફરી પૂછો.",
    failed: (c) => "અમારી બાજુ કંઈક ખોટું થયું (" + c + "). ફરી પ્રયાસ કરો.",
    offline: "સર્વર સુધી પહોંચી શકાતું નથી. ઇન્ટરનેટ તપાસીને ‘ફરી પ્રયાસ કરો’ દબાવો.", retry: "ફરી પ્રયાસ કરો",
    switched: "ઠીક છે, હવે જવાબ ગુજરાતીમાં આવશે.",
  },
  hi: {
    locale: "hi-IN", hello: "नमस्ते 🙏", lede: (n, m) => m + " में आपके " + n + " स्कूलों का हाल।",
    week: "इस हफ्ते", heroTitle: (n) => "पहले इन " + n + " स्कूलों का दौरा करें", heroBtn: "दौरे की योजना देखें",
    stats: ["पहले मदद चाहिए", "नज़र रखें", "डेटा आना बाकी"], askAbout: "इनके बारे में पूछें", tryAsking: "ऐसे पूछकर देखें",
    tiles: ["हाजिरी", "कमज़ोर कक्षा", "अधूरा डेटा", "अधिकारी के लिए नोट"],
    trust: "हर आंकड़ा स्कूल के रिकॉर्ड से आता है (डेमो के लिए काल्पनिक डेटा)।", placeholder: "गुजराती, अंग्रेज़ी या हिंदी में पूछें…",

    loading: "स्कूल के रिकॉर्ड देख रहे हैं…",
    act: "क्या करें", why: "कारण", last: "पिछला दौरा", copy: "कॉपी करें", copied: "कॉपी हो गया",
    aiUsed: "AI की मदद से लिखा, हर आंकड़ा रिकॉर्ड से जाँचा", checked: "स्कूल के रिकॉर्ड से",
    rejectedNum: (x) => "AI ने ऐसा आंकड़ा (" + x + ") लिखा जो रिकॉर्ड में नहीं है, इसलिए उसका लिखा हटा दिया। यह जवाब सीधे रिकॉर्ड से है।",
    rejectedOther: "AI का लिखा जाँच में पास नहीं हुआ, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    unavailable: "AI अभी उपलब्ध नहीं है, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    paused: "अभी बहुत सवाल हैं, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    tooMany: "एक मिनट में बहुत सवाल हो गए। थोड़ा रुककर फिर पूछें।",
    failed: (c) => "हमारी तरफ़ कुछ गड़बड़ हुई (" + c + ")। फिर कोशिश करें।",
    offline: "सर्वर तक नहीं पहुँच पा रहे। इंटरनेट जाँचकर ‘फिर कोशिश करें’ दबाएँ।", retry: "फिर कोशिश करें",
    switched: "ठीक है, अब जवाब हिंदी में आएँगे।",
  },
};
// Inline line icons, no downloads.
const ICONS = ['<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>',
  '<path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>', '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>'];
const CHEV = '<path d="M9 6l6 6-6 6"/>';

const scriptOf = (text) => /[઀-૿]/.test(text) ? "gu" : /[ऀ-ॿ]/.test(text) ? "hi" : "en";
const uiKey = (fallback) => UI[lang] ? lang : UI[fallback] ? fallback : "en";
const ui = (fallback) => UI[uiKey(fallback)];
const homeLang = () => lang || "en";           // home: chosen language, English for Auto

// DOM helpers: text goes in as text, never as HTML.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function icon(paths, cls) {                    // static icons above only
  const s = el("span", cls);
  s.innerHTML = '<svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + "</svg>";
  return s;
}
function monthName(ym, t, style) { return new Date(ym + "-01T00:00:00").toLocaleString(t.locale, { month: style, year: "numeric" }); }

// ---------- home: answered before she types ----------
let overview = null, health = null;            // overview: null loading, false failed
function renderHome() {
  const key = homeLang(), t = UI[key], nameKey = key === "gu" ? "gu" : "en";
  home.replaceChildren(el("h2", "hello", t.hello));
  if (overview) {
    home.appendChild(el("p", "lede", t.lede(overview.schools_total, monthName(overview.month, t, "long"))));
    const hero = el("div", "card hero");
    hero.append(el("p", "overline", t.week), el("h3", "", t.heroTitle(overview.visit_first.length)));
    overview.visit_first.forEach((s, i) => {
      const row = el("button", "row"), text = el("span", "grow"), top = el("span", "top");
      row.type = "button";
      top.append(el("b", "", s[nameKey]), el("span", "tag " + s.priority, Q.tags[key][s.priority]));
      text.appendChild(top);
      const why = nameKey === "gu" ? s.why_gu : s.why_en;
      if (why && key !== "hi") text.appendChild(el("small", "", why));
      row.append(el("span", "num", String(i + 1)), text, icon(CHEV, "chev"));
      row.addEventListener("click", () => askServer(aboutQuestion(s[nameKey], key), s.school_id, s[nameKey]));
      hero.appendChild(row);
    });
    const go = el("button", "btn", t.heroBtn);
    go.type = "button";
    go.addEventListener("click", () => askServer(Q.visit[key], null, t.heroBtn));
    hero.appendChild(go);
    const stats = el("div", "card stats");
    [[overview.counts.High, "high"], [overview.counts.Medium, "med"], [overview.counts.not_enough_data, ""]].forEach(([n, cls], i) => {
      const s = el("div");
      s.append(el("b", cls, String(n)), el("span", "", t.stats[i]));
      stats.appendChild(s);
    });
    home.append(hero, stats);
  } else if (overview === null) {               // hold the space, so nothing jumps
    const wait = el("div", "card wait");
    wait.setAttribute("aria-hidden", "true");
    wait.innerHTML = '<p class="skel"></p>'.repeat(6);
    home.appendChild(wait);
  }
  home.appendChild(el("h2", "section", t.askAbout));
  const tiles = el("div", "tiles");
  Q.tiles[key].forEach((question, i) => {
    const tile = el("button", "card tile");
    tile.type = "button";
    tile.append(icon(ICONS[i], "ico"), el("b", "", t.tiles[i]));
    tile.addEventListener("click", () => askServer(question, null, t.tiles[i]));
    tiles.appendChild(tile);
  });
  home.append(tiles, el("h2", "section", t.tryAsking));
  const list = el("div", "card list");
  Q.examples[lang || "auto"].forEach((question) => {
    const b = el("button", "ex");
    b.type = "button"; b.lang = scriptOf(question);
    b.append(el("span", "", question), icon(CHEV, "chev"));
    b.addEventListener("click", () => askServer(question));
    list.appendChild(b);
  });
  home.append(list, el("p", "trust", t.trust));
  setBusy(busy);                               // a redraw while loading stays dimmed
}
function aboutQuestion(name, key) { return key === "gu" ? name + " વિશે જણાવો" : key === "hi" ? name + " के बारे में बताओ" : "Tell me about " + name; }

// ---------- answers ----------
function renderCards(box, c, lead, t) {
  if (lead) box.appendChild(el("p", "lead", lead));
  if (c.note) box.appendChild(el("p", "sub", c.note));
  box.appendChild(el("p", "headline", c.title));
  box.appendChild(el("p", "sub", c.subtitle));
  c.schools.forEach((s, i) => {
    const card = el("div", "card school " + s.priority), head = el("div", "school-head");
    head.append(el("span", "num", String(i + 1)), el("h3", "", s.name), el("span", "tag " + s.priority, s.priority_label));
    const meter = el("div", "meter"), bar = el("div", "bar"), fill = el("i");
    bar.setAttribute("aria-hidden", "true");     // the score is also written next to it
    fill.style.width = Math.max(0, Math.min(100, (100 * s.score) / s.score_scale)) + "%";
    bar.appendChild(fill);
    meter.append(bar, el("span", "", s.score + "/" + s.score_scale));
    const why = el("ul");
    s.reasons.forEach((r) => why.appendChild(el("li", "", r)));
    const act = el("div", "do");
    act.append(el("b", "", t.act), document.createTextNode(s.action));
    card.append(head, meter, el("p", "label", t.why), why, act, el("p", "last", t.last + " " + s.last_visit));
    box.appendChild(card);
  });
  if (c.status) box.appendChild(el("p", "", c.status));
  if (c.also && c.also.length) {
    const note = el("div", "note"), list = el("ul");
    note.appendChild(el("b", "", c.also_title));
    c.also.forEach((a) => list.appendChild(el("li", "", a)));
    note.appendChild(list);
    box.appendChild(note);
  }
}
// Other answers: the WhatsApp text, laid out to scan.
const ACTION = /^(Do|શું કરવું|करें|क्या करें)\s*:\s*/;
function renderText(box, text, lead, t) {
  let list = null, first = true;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { list = null; continue; }
    if (line.startsWith("• ")) {
      if (!list) { list = el("ul"); box.appendChild(list); }
      list.appendChild(el("li", "", line.slice(2)));
      continue;
    }
    list = null;
    if (lead && line === lead) { box.appendChild(el("p", "lead", line)); continue; }      // the AI's line, then the title
    if (first) { box.appendChild(el("p", "headline", line)); first = false; continue; }
    const m = line.match(ACTION);
    if (m) {                                    // the same label as on the visit-plan cards
      const d = el("div", "do");
      d.append(el("b", "", t.act), document.createTextNode(line.slice(m[0].length)));
      box.appendChild(d);
      continue;
    }
    if (/^\d+\.\s/.test(line)) { box.appendChild(el("p", "item", line)); continue; }
    if (/^\s{2,}/.test(raw)) { box.appendChild(el("p", "indent", line.trim())); continue; }
    if (line.endsWith(":") && line.length < 70) { box.appendChild(el("p", "subhead", line)); continue; }
    box.appendChild(el("p", "", line));
  }
}
// One honest line under each answer: how it was made.
function describe(check, t) {
  if (check.rejected) {
    const found = (check.unsupported || []).concat(check.number_words || []).join(", ");
    return [found ? t.rejectedNum(found) : t.rejectedOther, "bad"];
  }
  if (check.ai_used) return [t.aiUsed, ""];
  if (check.ai_paused) return [t.paused, "warn"];
  if (check.error) return [t.unavailable, "warn"];
  return [t.checked, ""];
}
function chips(box, options) {
  if (!options || !options.length) return;
  const row = el("div", "actions");
  options.forEach((o) => {
    const c = el("button", "chip", o.label);
    c.type = "button";
    c.addEventListener("click", () => askServer(o.question, o.school_id, o.shown || o.label));
    row.appendChild(c);
  });
  box.appendChild(row);
}

let busy = false;
function setBusy(on) {                         // one answer at a time: dim what must wait
  busy = send.disabled = on;
  chat.querySelectorAll("#home button, .chip:not(.ghost)").forEach((b) => b.setAttribute("aria-disabled", on));
}
async function askServer(question, schoolId, shown) {
  question = (question || "").trim();
  if (!question || busy) return;
  setBusy(true);
  const tk = uiKey(scriptOf(question)), t = UI[tk];
  const q = el("div", "q"); q.lang = scriptOf(shown || question); q.appendChild(el("span", "", shown || question)); thread.appendChild(q);
  const answer = el("div", "a"), wait = el("div", "loading"), dots = el("span", "dots");
  answer.lang = tk;
  answer.setAttribute("aria-busy", "true");
  dots.append(el("i"), el("i"), el("i"));
  wait.append(dots, el("span", "", t.loading));
  answer.appendChild(wait); thread.appendChild(answer);
  chat.scrollTop = q.offsetTop - chat.offsetTop - 8;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);   // longer than the server's worst case
  try {
    const res = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ question, lang: lang || null, school_id: schoolId || null, test_checker: test.checked }),
    });
    answer.replaceChildren();
    if (res.status === 429) return retry(answer, t.tooMany, t, question, schoolId, shown);
    if (!res.ok) return retry(answer, t.failed(res.status), t, question, schoolId, shown);
    const r = await res.json(), rk = uiKey(r.lang), tr = UI[rk];
    answer.lang = r.lang;
    let [meta, cls] = describe(r.check || {}, tr);
    if (test.checked && r.check && r.check.test_checker === false) { meta = "(Number-checker test: the AI is off.) " + meta; cls = "warn"; }
    const metaEl = el("p", "meta " + cls, (cls ? "" : "✓ ") + meta), row = el("div", "actions"), copy = el("button", "chip ghost", tr.copy);
    metaEl.lang = row.lang = rk;
    if (cls) answer.appendChild(metaEl);                         // warnings first, where they are seen
    if (r.cards) renderCards(answer, r.cards, r.lead, UI[r.lang] || tr); else renderText(answer, r.text, r.lead, UI[r.lang] || tr);
    if (!cls) answer.appendChild(metaEl);
    copy.type = "button";
    copy.addEventListener("click", () => {      // the plain text, ready to forward on WhatsApp
      if (navigator.clipboard) navigator.clipboard.writeText(r.text).then(() => { copy.textContent = "✓ " + tr.copied; }, () => {});
    });
    row.appendChild(copy);
    answer.appendChild(row);
    chips(answer, r.options);
  } catch (e) {
    answer.replaceChildren();
    retry(answer, t.offline, t, question, schoolId, shown);
  } finally {
    clearTimeout(timer); setBusy(false);
    answer.removeAttribute("aria-busy");
    chat.scrollTop = q.offsetTop - chat.offsetTop - 8;          // the question on top, its answer below
  }
}
function retry(answer, message, t, question, schoolId, shown) {
  answer.appendChild(el("p", "meta warn", message));
  chips(answer, [{ label: t.retry, question, school_id: schoolId, shown: shown || question }]);
}

// ---------- language, header, start ----------
function setLang(value, announce) {
  lang = value;
  try { localStorage.setItem("saathi-lang", value); } catch (e) { /* storage blocked */ }
  pick.value = value;
  const key = homeLang(), h = UI[key];
  document.documentElement.lang = key;          // screen readers read the page in its own language
  pick.setAttribute("aria-label", h.pickLabel);
  $("qlabel").textContent = h.qLabel;
  send.setAttribute("aria-label", h.sendLabel);
  box.placeholder = h.placeholder;
  if (health) $("sub").textContent = h.sub(health.schools, monthName(health.latest_month, h, "short"));
  renderHome();
  if (!announce || !thread.childElementCount) return;
  const note = el("p", "meta");
  if (UI[lang]) note.textContent = UI[lang].switched;
  else { const gu = el("span", "", "જવાબ તમારા પ્રશ્નની ભાષામાં આવશે."); gu.lang = "gu"; note.append(gu, " / Replies follow the language you ask in."); }
  thread.appendChild(note);
}
pick.addEventListener("change", () => setLang(pick.value, true));

form.addEventListener("submit", (e) => { e.preventDefault(); if (busy) return; const v = box.value; box.value = ""; grow(); askServer(v); });
box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
function grow() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 120) + "px"; }
box.addEventListener("input", grow);

// /?q=...&lang=gu asks a question on opening; &test=1 ticks the checker test.
const params = new URLSearchParams(location.search);
let saved = "";
try { saved = localStorage.getItem("saathi-lang") || ""; } catch (e) { /* storage blocked */ }
const LANGS = ["", "en", "gu", "hi"];
setLang(LANGS.includes(params.get("lang")) ? params.get("lang") : LANGS.includes(saved) ? saved : "", false);
if (params.get("test") === "1") { test.checked = true; review.open = true; }
if (params.get("review") === "1") review.open = true;

Promise.all([
  fetch("/overview").then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((o) => { overview = o; })
    .catch(() => { overview = false; }),
  fetch("/health").then((r) => r.json()).then((h) => { health = h; statusEl.textContent = h.llm ? "AI: on" : "AI: off (rules only)"; })
    .catch(() => { statusEl.textContent = "offline?"; }),
]).then(() => {
  setLang(lang, false);
  if (params.get("q")) askServer(params.get("q").slice(0, 500));
});
</script>
