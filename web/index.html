<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Shiksha Saathi</title>
<style>
  /* Calm and simple: neutral surfaces, one teal accent, colour only where it carries meaning.
     Every text colour meets WCAG AA (4.5:1) on its background, in light and dark mode. */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #111827; --muted: #5b6472; --border: #e5e7eb; --soft: #f1f3f5;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e6f4f1; --accent-text: #0b5e57;
    --high: #dc2626; --high-text: #b42318; --high-soft: #fdecea;
    --med: #d97706; --med-text: #8a4b00; --med-soft: #fff4e0;
    --low: #059669; --low-text: #04704f; --low-soft: #e7f6ef;
    --do-bg: #ecf7f4; --do-edge: #0f766e; --do-text: #0b3d38; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --surface: #151b23; --text: #e6e9ee; --muted: #9aa4b2; --border: #26303c; --soft: #1b232d;
      --accent: #2dd4bf; --accent-ink: #062b27; --accent-soft: #0f2e2b; --accent-text: #7ee8db;
      --high: #f87171; --high-text: #fca5a5; --high-soft: #3a1717; --med: #fbbf24; --med-text: #fcd34d; --med-soft: #3a2a0c;
      --low: #34d399; --low-text: #6ee7b7; --low-soft: #0f2f24; --do-bg: #10261f; --do-edge: #2dd4bf; --do-text: #d5f5ee;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Gujarati", "Noto Sans Devanagari", sans-serif; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg); }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; flex: none; }
  .brand { flex: 1; min-width: 0; line-height: 1.2; }
  .brand b { display: block; font-size: 17px; }
  .brand span { font-size: 12.5px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .langs { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; flex: none; }
  .langs button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--muted); padding: 5px 9px;
                  border-radius: 999px; cursor: pointer; min-height: 30px; }
  .langs button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  main { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  h2 { font-size: 24px; line-height: 1.25; margin: 10px 0 2px; font-weight: 700; letter-spacing: -.01em; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .overline { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); margin: 0; }
  .hero h3 { font-size: 19px; margin: 4px 0 10px; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border);
         width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0;
         font: inherit; color: inherit; cursor: pointer; }
  .row:first-of-type { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--high); margin-top: 7px; flex: none; }
  .dot.Medium { background: var(--med); } .dot.Low { background: var(--low); }
  .row b { display: block; } .row small { color: var(--muted); font-size: 14px; }
  .btn { font: inherit; font-weight: 600; display: block; width: 100%; margin-top: 12px; padding: 12px 16px; border: 0;
         border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; min-height: 48px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .stat { padding: 12px 10px; }
  .stat b { display: block; font-size: 26px; line-height: 1.1; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.high b { color: var(--high-text); } .stat.med b { color: var(--med-text); }
  .section { font-size: 14px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { font: inherit; color: var(--text); text-align: left; cursor: pointer; display: flex; flex-direction: column;
          gap: 8px; min-height: 92px; }
  .tile .ico { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-text);
               display: grid; place-items: center; }
  .tile span { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .trust { font-size: 13px; color: var(--muted); text-align: center; margin: 18px 0 4px; }
  .thread { margin-top: 18px; }
  .q { display: flex; justify-content: flex-end; margin: 18px 0 10px; }
  .q span { background: var(--accent); color: var(--accent-ink); padding: 9px 14px; border-radius: 18px 18px 4px 18px;
            max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { overflow-wrap: anywhere; }
  .a p { margin: 0 0 8px; }
  .lead { font-size: 17px; font-weight: 600; margin-bottom: 12px !important; }
  .sub { color: var(--muted); font-size: 14px; }
  .headline { font-weight: 600; }
  .subhead { font-weight: 600; margin-top: 12px !important; }
  .item { font-weight: 600; margin-top: 12px !important; }
  .indent { padding-left: 14px; }
  .a ul { margin: 0 0 10px; padding-left: 20px; } .a li { margin: 3px 0; }
  .do { background: var(--do-bg); border-left: 3px solid var(--do-edge); color: var(--do-text); border-radius: 10px;
        padding: 10px 12px; margin: 10px 0; }
  .do b { display: block; font-size: 13px; margin-bottom: 2px; }
  .school { margin: 12px 0; }
  .school-head { display: flex; align-items: center; gap: 10px; }
  .num { width: 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center;
         font-size: 13px; font-weight: 700; flex: none; }
  .school-name { font-size: 18px; font-weight: 700; flex: 1; min-width: 0; }
  .tag { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--high-soft); color: var(--high-text);
         white-space: nowrap; }
  .Medium .tag { background: var(--med-soft); color: var(--med-text); } .Low .tag { background: var(--low-soft); color: var(--low-text); }
  .meter { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; font-size: 13px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--high); border-radius: 99px; }
  .Medium .bar i { background: var(--med); } .Low .bar i { background: var(--low); }
  .label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 0 2px; }
  .last { font-size: 13.5px; color: var(--muted); }
  .note { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .note b { display: block; margin-bottom: 4px; }
  .meta { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
  .meta.warn { color: var(--med-text); } .meta.bad { color: var(--high-text); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border);
          border-radius: 999px; padding: 7px 14px; min-height: 38px; cursor: pointer; text-align: left; }
  .chip.ghost { color: var(--muted); }
  .dots { display: inline-flex; gap: 5px; padding: 10px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
  button:active { transform: scale(.985); }
  footer { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border); }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
             border-radius: 14px; padding: 11px 14px; resize: none; max-height: 120px; min-height: 46px; }
  .send { width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
          cursor: pointer; flex: none; display: grid; place-items: center; }
  .send:disabled { opacity: .5; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  details.review { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  details.review summary { cursor: pointer; }
  details.review .rv { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding-top: 4px; }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
  </div>
  <div class="brand"><b>Shiksha Saathi</b><span id="sub">શિક્ષા સાથી</span></div>
  <div class="langs" role="group" aria-label="Reply language" id="langs">
    <button type="button" data-lang="">Auto</button>
    <button type="button" data-lang="gu">ગુ</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="hi">हि</button>
  </div>
</header>

<main id="chat" aria-live="polite">
  <section id="home"></section>
  <section class="thread" id="thread"></section>
</main>

<footer>
  <form id="form">
    <label class="sr" for="q">Your question</label>
    <textarea id="q" rows="1" maxlength="500" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <!-- Tools for reviewers, folded away so they do not distract a CRC; ?test=1 or ?review=1 opens them. -->
  <details class="review" id="review">
    <summary>For reviewers</summary>
    <div class="rv">
      <label title="Adds a made-up figure (99.9%) to the AI's text, to show the number checker catching it">
        <input type="checkbox" id="test"> Test the number checker
      </label>
      <span id="status"></span>
    </div>
  </details>
</footer>
</div>

    trust: "हर आंकड़ा स्कूल के रिकॉर्ड से आता है (डेमो के लिए काल्पनिक डेटा)।", placeholder: "गुजराती, अंग्रेज़ी या हिंदी में पूछें…",
    sub: (n, m) => n + " स्कूल · " + m,
    act: "क्या करें", why: "कारण", last: "पिछला दौरा", copy: "कॉपी करें", copied: "कॉपी हो गया",
    aiUsed: "AI की मदद से लिखा · हर आंकड़ा रिकॉर्ड से जाँचा", checked: "स्कूल के रिकॉर्ड से",
    rejectedNum: (x) => "AI ने ऐसा आंकड़ा (" + x + ") लिखा जो रिकॉर्ड में नहीं है, इसलिए उसका लिखा हटा दिया। यह जवाब सीधे रिकॉर्ड से है।",
    rejectedOther: "AI का लिखा जाँच में पास नहीं हुआ, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    unavailable: "AI अभी उपलब्ध नहीं है, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    paused: "अभी बहुत सवाल हैं, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    testNeedsAi: "आंकड़ा-जाँच की परीक्षा के लिए AI चाहिए, जो अभी बंद है।",
    tooMany: "एक मिनट में बहुत सवाल हो गए। थोड़ा रुककर फिर पूछें।",
    failed: (c) => "हमारी तरफ़ कुछ गड़बड़ हुई (" + c + ")। फिर कोशिश करें।",
    offline: "सर्वर तक नहीं पहुँच पा रहे। इंटरनेट जाँचकर ‘फिर कोशिश करें’ दबाएँ।", retry: "फिर कोशिश करें",
    switched: "ठीक है, अब जवाब हिंदी में आएँगे।",
  },
};
const AUTO_SWITCHED = "જવાબ તમારા પ્રશ્નની ભાષામાં આવશે. / Replies follow the language you ask in.";
const ICONS = [   // simple line icons, drawn inline (no files to download)
  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>',
  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/></svg>',
  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
];

const scriptOf = (text) => /[઀-૿]/.test(text) ? "gu" : /[ऀ-ॿ]/.test(text) ? "hi" : "en";
const ui = (fallback) => UI[lang] || UI[fallback] || UI.en;
const homeLang = () => lang || "en";           // the home screen: the chosen language, English for Auto

// Small DOM helper. Text is always inserted as text, never as HTML.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function monthName(ym, t, style) { return new Date(ym + "-01T00:00:00").toLocaleString(t.locale, { month: style, year: "numeric" }); }

// ---------- home: the block officer's question, answered before she types ----------
let overview = null, health = null;
function renderHome() {
  const t = UI[homeLang()], key = homeLang(), nameKey = key === "gu" ? "gu" : "en";
  home.replaceChildren();
  home.appendChild(el("h2", "", t.hello));
  if (!overview) { home.appendChild(el("p", "lede", t.trust)); renderTiles(t, key); return; }
  const month = monthName(overview.month, t, "long");
  home.appendChild(el("p", "lede", t.lede(overview.schools_total, month)));

  const hero = el("div", "card hero");
  hero.append(el("p", "overline", t.week), el("h3", "", t.heroTitle(overview.visit_first.length)));
  overview.visit_first.forEach((s) => {
    const row = el("button", "row");
    row.type = "button";
    const text = el("div");
    text.append(el("b", "", s[nameKey]));
    const why = nameKey === "gu" ? s.why_gu : s.why_en;
    if (why && key !== "hi") text.appendChild(el("small", "", why));
    row.append(el("span", "dot " + s.priority), text);
    row.addEventListener("click", () => askServer(aboutQuestion(s[nameKey], key), s.school_id, s[nameKey]));
    hero.appendChild(row);
  });
  const go = el("button", "btn", t.heroBtn);
  go.type = "button";
  go.addEventListener("click", () => askServer(Q.tiles[key][0], null, t.heroBtn));
  hero.appendChild(go);
  home.appendChild(hero);

  const stats = el("div", "stats");
  [[overview.counts.High, "high"], [overview.counts.Medium, "med"], [overview.counts.not_enough_data, ""]].forEach(([n, cls], i) => {
    const s = el("div", "card stat " + cls);
    s.append(el("b", "", String(n)), el("span", "", t.stats[i]));
    stats.appendChild(s);
  });
  home.appendChild(stats);
  renderTiles(t, key);
}
function renderTiles(t, key) {
  home.appendChild(el("p", "section", t.askAbout));
  const tiles = el("div", "tiles");
  Q.tiles[key].forEach((question, i) => {
    const tile = el("button", "card tile"), ico = el("span", "ico");
    tile.type = "button";
    ico.innerHTML = ICONS[i];               // our own static icon, not text from the server
    tile.append(ico, el("span", "", t.tiles[i]));
    tile.addEventListener("click", () => askServer(question, null, t.tiles[i]));
    tiles.appendChild(tile);
  });
  home.appendChild(tiles);
  home.appendChild(el("p", "trust", t.trust));
}
function aboutQuestion(name, key) { return key === "gu" ? name + " વિશે જણાવો" : key === "hi" ? name + " के बारे में बताओ" : "Tell me about " + name; }

// ---------- answers ----------
function renderCards(box, c, lead, t) {
  if (lead) box.appendChild(el("p", "lead", lead));
  if (c.note) box.appendChild(el("p", "sub", c.note));
  box.appendChild(el("p", "headline", c.title));
  box.appendChild(el("p", "sub", c.subtitle));
  c.schools.forEach((s, i) => {
    const card = el("div", "card school " + s.priority), head = el("div", "school-head");
    head.append(el("span", "num", String(i + 1)), el("span", "school-name", s.name), el("span", "tag", s.priority_label));
    const meter = el("div", "meter"), bar = el("div", "bar"), fill = el("i");
    fill.style.width = Math.max(0, Math.min(100, (100 * s.score) / s.score_scale)) + "%";
    bar.appendChild(fill);
    meter.append(bar, el("span", "", s.score + "/" + s.score_scale));
    const why = el("ul");
    s.reasons.forEach((r) => why.appendChild(el("li", "", r)));
    const act = el("div", "do");
    act.append(el("b", "", t.act), document.createTextNode(s.action));
    card.append(head, meter, el("p", "label", t.why), why, act, el("p", "last", t.last + " " + s.last_visit));
    box.appendChild(card);
  });
  if (c.status) box.appendChild(el("p", "", c.status));
  if (c.also && c.also.length) {
    const note = el("div", "note"), list = el("ul");
    note.appendChild(el("b", "", c.also_title));
    c.also.forEach((a) => list.appendChild(el("li", "", a)));
    note.appendChild(list);
    box.appendChild(note);
  }
}
// Every other answer keeps the text WhatsApp would show, laid out to scan: headline, bullets, the action highlighted.
const ACTION = /^(Do|શું કરવું|करें|क्या करें)\s*:\s*/;
function renderText(box, text, lead) {
  let list = null, first = true;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { list = null; continue; }
    if (line.startsWith("• ")) {
      if (!list) { list = el("ul"); box.appendChild(list); }
      list.appendChild(el("li", "", line.slice(2)));
      continue;
    }
    list = null;
    if (first) { box.appendChild(el("p", lead && line === lead ? "lead" : "headline", line)); first = false; continue; }
    const m = line.match(ACTION);
    if (m) {
      const d = el("div", "do");
      d.append(el("b", "", m[1]), document.createTextNode(line.slice(m[0].length)));
      box.appendChild(d);
      continue;
    }
    if (/^\d+\.\s/.test(line)) { box.appendChild(el("p", "item", line)); continue; }
    if (/^\s{2,}/.test(raw)) { box.appendChild(el("p", "indent", line.trim())); continue; }
    if (line.endsWith(":") && line.length < 70) { box.appendChild(el("p", "subhead", line)); continue; }
    box.appendChild(el("p", "", line));
  }
}
// One honest line under each answer: how it was made.
function describe(check, t) {
  if (check.rejected) {
    const found = (check.unsupported || []).concat(check.number_words || []).join(", ");
    return [found ? t.rejectedNum(found) : t.rejectedOther, "bad"];
  }
  if (check.ai_used) return [t.aiUsed, ""];
  if (check.ai_paused) return [t.paused, "warn"];
  if (check.error) return [t.unavailable, "warn"];
  return [t.checked, ""];
}
function chips(box, options) {
  if (!options || !options.length) return;
  const row = el("div", "actions");
  options.forEach((o) => {
    const c = el("button", "chip", o.label);
    c.type = "button";
    c.addEventListener("click", () => askServer(o.question, o.school_id, o.shown || o.label));
    row.appendChild(c);
  });
  box.appendChild(row);
}

let busy = false;
async function askServer(question, schoolId, shown) {
  question = (question || "").trim();
  if (!question || busy) return;
  busy = true; send.disabled = true;
  const t = ui(scriptOf(question));
  const q = el("div", "q"); q.appendChild(el("span", "", shown || question)); thread.appendChild(q);
  const answer = el("div", "a"), dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i")); answer.appendChild(dots); thread.appendChild(answer);
  chat.scrollTop = q.offsetTop - chat.offsetTop - 8;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);   // longer than the server's worst case
  try {
    const res = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ question, lang: lang || null, school_id: schoolId || null, test_checker: test.checked }),
    });
    answer.replaceChildren();
    if (res.status === 429) return retry(answer, t.tooMany, t, question, schoolId, shown);
    if (!res.ok) return retry(answer, t.failed(res.status), t, question, schoolId, shown);
    const r = await res.json(), tr = ui(r.lang);
    let [meta, cls] = describe(r.check || {}, tr);
    if (test.checked && r.check && r.check.test_checker === false) { meta = tr.testNeedsAi + " " + meta; cls = "warn"; }
    if (cls) answer.appendChild(el("p", "meta " + cls, meta));      // warnings first, where they are seen
    if (r.cards) renderCards(answer, r.cards, r.lead, UI[r.lang] || tr); else renderText(answer, r.text, r.lead);
    if (!cls) answer.appendChild(el("p", "meta", "✓ " + meta));
    const row = el("div", "actions"), copy = el("button", "chip ghost", tr.copy);
    copy.type = "button";
    copy.addEventListener("click", () => {      // the plain text, ready to forward on WhatsApp
      if (navigator.clipboard) navigator.clipboard.writeText(r.text).then(() => { copy.textContent = "✓ " + tr.copied; }, () => {});
    });
    row.appendChild(copy);
    answer.appendChild(row);
    chips(answer, r.options);
  } catch (e) {
    answer.replaceChildren();
    retry(answer, t.offline, t, question, schoolId, shown);
  } finally {
    clearTimeout(timer); busy = false; send.disabled = false;
    chat.scrollTop = q.offsetTop - chat.offsetTop - 8;          // the question on top, its answer below
  }
}
function retry(answer, message, t, question, schoolId, shown) {
  answer.appendChild(el("p", "meta warn", message));
  chips(answer, [{ label: t.retry, question, school_id: schoolId, shown: shown || question }]);
}

// ---------- language, header, start ----------
function setLang(value, announce) {
  lang = value;
  try { localStorage.setItem("saathi-lang", value); } catch (e) { /* storage blocked */ }
  document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === value)));
  const t = UI[lang];
  box.placeholder = (t || UI.en).placeholder;
  if (health) $("sub").textContent = UI[homeLang()].sub(health.schools, monthName(health.latest_month, UI[homeLang()], "short"));
  renderHome();
  if (announce && thread.childElementCount) thread.appendChild(el("p", "meta", t ? t.switched : AUTO_SWITCHED));
}
document.querySelectorAll("#langs button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang, true)));

form.addEventListener("submit", (e) => { e.preventDefault(); const v = box.value; box.value = ""; grow(); askServer(v); });
box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
function grow() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 120) + "px"; }
box.addEventListener("input", grow);

// A shared link can carry a question: /?q=...&lang=gu asks it on opening; &test=1 shows the number checker at work.
const params = new URLSearchParams(location.search);
let saved = "";
try { saved = localStorage.getItem("saathi-lang") || ""; } catch (e) { /* storage blocked */ }
setLang(["en", "gu", "hi"].includes(params.get("lang")) ? params.get("lang") : saved, false);
if (params.get("test") === "1") { test.checked = true; review.open = true; }
if (params.get("review") === "1") review.open = true;

Promise.all([
  fetch("/overview").then((r) => r.json()).then((o) => { overview = o; }).catch(() => {}),
  fetch("/health").then((r) => r.json()).then((h) => { health = h; statusEl.textContent = h.llm ? "AI: on" : "AI: off (rules only)"; })
    .catch(() => { statusEl.textContent = "offline?"; }),
]).then(() => {
  setLang(lang, false);
  if (params.get("q")) askServer(params.get("q").slice(0, 500));
});
</script>
