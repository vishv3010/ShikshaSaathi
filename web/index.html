<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f5f6f4">
<title>Shiksha Saathi</title>
<style>
/* Light only (D-034). One bold thing, the blackboard (D-032). One square = one school, coloured by need. */
:root {
color-scheme: only light;
--paper: #f5f6f4; --card: #fff; --ink: #17231f; --muted: #56645e; --rule: #dde4e1; --line: #7f8d87; --tint: #e7eeea;
--board: #1e4b3e; --chalk: #f4f2ea; --chalk-2: #cbd8d1; --chalk-line: #33604f; --s: 1;
}
.High { --c: #c8321f; --t: #a3261a; --k: #f4a593; --n: #fff; }
.Medium { --c: #c47c00; --t: #7a4300; --k: #f1d38a; --n: var(--ink); }
.Low { --c: #4f9a6c; --t: #22693f; --k: #a9d8b8; --n: var(--ink); }
:lang(gu), :lang(hi) { --s: 1.0625; }
:lang(en) { --s: 1; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink);
 font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Gujarati", "Noto Sans Devanagari", sans-serif; }
button, select, textarea { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 680px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
.brand { flex: 1; min-width: 0; line-height: 1.25; }
.brand h1 { font-size: 18px; font-weight: 700; margin: 0; }
.brand span { font-size: 13px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick { position: relative; flex: none; display: flex; align-items: center; }
.aA { position: absolute; left: 11px; font-size: 17px; font-weight: 700; line-height: 1; pointer-events: none; }
.aA small { font-size: 12px; }
.pick svg { position: absolute; right: 10px; pointer-events: none; color: var(--muted); }
.pick select { appearance: none; -webkit-appearance: none; field-sizing: content; font-size: 14px; font-weight: 600; height: 44px;
 padding: 0 30px 0 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; }
main { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
#home, .q, .a { font-size: calc(1rem * var(--s)); }
.hero { background: var(--board); color: var(--chalk); border-radius: 16px; padding: 16px 16px 14px; margin-top: 16px;
 box-shadow: inset 0 -6px 0 var(--chalk-line); }
.hero :focus-visible { outline-color: var(--chalk); }
.hero h2 { font-size: 1.3125em; font-weight: 700; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.row, .ex { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--rule);
 background: none; text-align: left; cursor: pointer; }
.row { margin: 0 -16px; width: calc(100% + 32px); padding: 12px 16px; border-top-color: var(--chalk-line); }
.ex:first-child { border-top: 0; }
.row:active { background: var(--chalk-line); } .ex:active { background: var(--tint); }
.grow { flex: 1; min-width: 0; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 2px 10px; flex-wrap: wrap; }
.row b { font-size: 1.0625em; }
.row small { display: block; color: var(--chalk-2); font-size: .875em; margin-top: 2px; }
.status { font-size: .8125em; font-weight: 600; color: var(--t); white-space: nowrap; }
.hero .status { color: var(--k); }
.sq { width: 26px; height: 26px; border-radius: 6px; background: var(--c); color: var(--n); display: grid; place-items: center;
 font-size: .8125em; font-weight: 700; flex: none; }
.hero .sq { background: var(--k); color: var(--board); }
.chev { color: var(--muted); flex: none; display: flex; } .hero .chev { color: var(--chalk-2); }
.btn { font-weight: 700; display: block; width: 100%; margin-top: 12px; padding: 12px 16px; border: 0; border-radius: 10px;
 background: var(--chalk); color: var(--board); cursor: pointer; min-height: 48px; }
.wait { min-height: 18.5em; } .skel { height: 14px; border-radius: 7px; background: var(--chalk-line); margin: 14px 0; }
.skel:nth-child(odd) { width: 60%; }
.section { font-size: .9375em; font-weight: 700; margin: 24px 0 10px; }
.strip { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.strip i, .key i, .gap i { aspect-ratio: 1; border-radius: 3px; background: var(--c, var(--card)); box-shadow: inset 0 0 0 1.5px var(--c, var(--line)); }
.key { list-style: none; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
 font-size: .875em; color: var(--muted); }
.key li, .gap { display: flex; align-items: baseline; gap: 8px; }
.key i, .gap i { width: 11px; flex: none; }
.key b { color: var(--ink); }
.topics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.topic { min-height: 48px; padding: 10px 14px; border: 1px solid #cbd4d0; border-radius: 10px; background: var(--card);
 text-align: left; font-weight: 600; cursor: pointer; }
.list { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.ex { min-height: 52px; padding: 12px 16px; } .ex span:first-child { flex: 1; }
.trust { font-size: .8125em; color: var(--muted); margin: 20px 0 4px; }
.q { display: flex; justify-content: flex-end; margin: 28px 0 12px; }
.q span { background: var(--tint); padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 85%; white-space: pre-wrap;
 overflow-wrap: anywhere; }
.a { overflow-wrap: anywhere; }
.a p { margin: 0 0 8px; }
.a .lead { font-size: 1.0625em; margin-bottom: 12px; }
.sub { color: var(--muted); font-size: .875em; }
.headline, .subhead, .item { font-weight: 700; }
.a .subhead, .a .item { margin-top: 12px; }
.indent { padding-left: 14px; }
.a ul { margin: 0 0 10px; padding-left: 20px; } .a li { margin: 3px 0; }
.a .do { background: var(--tint); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
.school { margin: 12px 0; }
.school-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.school h3 { font-size: 1.125em; font-weight: 700; flex: 1 1 auto; margin: 0; overflow-wrap: normal; }
.meter { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; font-size: .8125em; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--tint); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--line)); }
.meter b { color: var(--ink); font-weight: 600; }
.school ul { margin: 0 0 4px; padding-left: 18px; font-size: .9375em; }
.a .last { font-size: .8125em; color: var(--muted); margin: 0; }
.a .gap { font-size: .9375em; margin: 12px 0; }
details.more { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 10px 0; }
details.more summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
 gap: 12px; min-height: 44px; padding: 8px 0; font-weight: 600; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; color: var(--muted); font-size: 1.25em; font-weight: 400; }
details.more[open] summary::after { content: "–"; }
.months { display: grid; grid-template-columns: auto minmax(40px, 1fr) auto; gap: 6px 10px; align-items: center; margin: 4px 0 12px; }
.months .v { font-size: .875em; color: var(--muted); } .months .wide { grid-column: 2 / -1; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 6px 0 4px; text-align: center; }
.col { display: flex; flex-direction: column; justify-content: flex-end; height: 78px; border-bottom: 1px solid var(--line); }
.col b { font-size: .8125em; font-weight: 600; }
.col i { background: var(--line); border-radius: 3px 3px 0 0; } .cols div:last-child i { background: var(--ink); }
.cols small { font-size: .75em; color: var(--muted); }
.a .meta, .meta { font-size: .8125em; color: var(--muted); margin: 10px 0 0; }
.meta.warn { color: #7a4300; } .meta.bad { color: #a3261a; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.chip { font-size: .875em; background: var(--card); border: 1px solid #cbd4d0; border-radius: 10px; padding: 8px 14px;
 min-height: 44px; cursor: pointer; text-align: left; }
.chip.ghost { color: var(--muted); }
.a .label { font-size: .8125em; font-weight: 700; color: var(--muted); margin: 6px 0 2px; }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .875em; padding: 6px 0; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
@media (prefers-reduced-motion: no-preference) { .chalk .row { animation: chalk .4s ease-out backwards; } }
@keyframes chalk { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
.btn:active, .topic:active, .chip:active, .send:active { transform: scale(.985); }
footer { padding: 10px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); }
form { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
 resize: none; max-height: 120px; min-height: 48px; }
textarea::placeholder { color: var(--muted); opacity: 1; }
.send { width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--board); color: var(--chalk);
 cursor: pointer; flex: none; display: grid; place-items: center; }
.send:disabled { opacity: .5; }
[aria-disabled=true] { opacity: .65; pointer-events: none; }
:focus-visible { outline: 3px solid var(--board); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
details.review { font-size: 13px; color: var(--muted); margin-top: 4px; }
details.review summary { cursor: pointer; padding: 3px 0; }
details.review .rv { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding-top: 4px; }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><h1 lang="en">Shiksha Saathi</h1><span id="sub"></span></div>
  <div class="pick">
    <span class="aA" aria-hidden="true"><span lang="gu">અ</span><small lang="en">A</small></span>
    <select id="pick" aria-label="Reply language">
      <option value="" id="any">Any language</option>
      <option value="gu" lang="gu">ગુજરાતી</option>
      <option value="en" lang="en">English</option>
      <option value="hi" lang="hi">हिन्दी</option>
    </select>
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>
</header>

<main id="chat">
  <section id="home"></section>
  <section class="thread" id="thread" role="log" aria-live="polite"></section>
</main>

<footer>
  <form id="form">
    <label class="sr" for="q" id="qlabel">Your question</label>
    <textarea id="q" rows="1" maxlength="500" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <!-- ?test=1 or ?review=1 opens these. -->
  <details class="review" id="review" lang="en">
    <summary>For reviewers</summary>
    <div class="rv">
      <label title="Adds a made-up figure (99.9%) to the AI's text, to show the number checker catching it">
        <input type="checkbox" id="test"> Test the number checker
      </label>
      <span id="status"></span>
    </div>
  </details>
</footer>
</div>

    offline: "સર્વર સુધી પહોંચી શકાતું નથી. ઇન્ટરનેટ તપાસીને ‘ફરી પ્રયાસ કરો’ દબાવો.", retry: "ફરી પ્રયાસ કરો",
    switched: "ઠીક છે, હવે જવાબ ગુજરાતીમાં આવશે.",
  },
  hi: {
    locale: "hi-IN", any: "कोई भी भाषा", heroTitle: (n) => "इस हफ्ते पहले इन " + n + " स्कूलों का दौरा करें",
    heroBtn: "दौरे की योजना देखें", allTitle: (n, m) => m + " में सभी " + n + " स्कूल",
    stats: ["पहले मदद चाहिए", "नज़र रखें", "ठीक चल रहा है", "डेटा आना बाकी"],
    askAbout: "इनके बारे में पूछें", tryAsking: "ऐसे पूछकर देखें", tiles: ["हाजिरी", "कम अंक", "अधूरा डेटा", "अधिकारी के लिए नोट"],
    trust: "हर आंकड़ा स्कूल के रिकॉर्ड से आता है (डेमो के लिए काल्पनिक डेटा)।", placeholder: "गुजराती, अंग्रेज़ी या हिंदी में पूछें…",
    sub: (n, m) => n + " स्कूल, " + m, pickLabel: "जवाब की भाषा", qLabel: "आपका सवाल", sendLabel: "भेजें",
    loading: "स्कूल के रिकॉर्ड देख रहे हैं…", slow: "थोड़ा ज़्यादा समय लग रहा है…",
    act: "क्या करें", need: "मदद की ज़रूरत", last: "पिछला दौरा", copy: "कॉपी करें", copied: "कॉपी हो गया", next: "आगे पूछें",
    aiUsed: "AI की मदद से लिखा, हर आंकड़ा रिकॉर्ड से जाँचा", checked: "स्कूल के रिकॉर्ड से",
    rejectedNum: (x) => "AI ने ऐसा आंकड़ा (" + x + ") लिखा जो रिकॉर्ड में नहीं है, इसलिए उसका लिखा हटा दिया। यह जवाब सीधे रिकॉर्ड से है।",
    rejectedOther: "AI का लिखा जाँच में पास नहीं हुआ, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    unavailable: "AI अभी उपलब्ध नहीं है, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    paused: "अभी बहुत सवाल हैं, इसलिए यह जवाब सीधे रिकॉर्ड से है।",
    tooMany: "एक मिनट में बहुत सवाल हो गए। थोड़ा रुककर फिर पूछें।",
    failed: (c) => "हमारी तरफ़ कुछ गड़बड़ हुई (" + c + ")। फिर कोशिश करें।",
    offline: "सर्वर तक नहीं पहुँच पा रहे। इंटरनेट जाँचकर ‘फिर कोशिश करें’ दबाएँ।", retry: "फिर कोशिश करें",
    switched: "ठीक है, अब जवाब हिंदी में आएँगे।",
  },
};

const scriptOf = (text) => /[઀-૿]/.test(text) ? "gu" : /[ऀ-ॿ]/.test(text) ? "hi" : "en";
const uiKey = (fallback) => UI[lang] ? lang : UI[fallback] ? fallback : "en";
const homeLang = () => lang || "en";

// Text goes in as text, never as HTML.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function chev() {
  const s = el("span", "chev");
  s.innerHTML = '<svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  return s;
}
function monthName(ym, t, style, year) {
  return new Date(ym + "-01T00:00:00").toLocaleString(t.locale, year === false ? { month: style } : { month: style, year: "numeric" });
}
function bar(pct) {                             // from zero, so small changes are not exaggerated
  const b = el("span", "bar"), fill = el("i");
  b.setAttribute("aria-hidden", "true");        // its figure is written next to it
  fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
  b.appendChild(fill);
  return b;
}
function fold(title, items) {                   // one tap away, nothing removed
  const d = el("details", "more"), list = el("ul");
  d.appendChild(el("summary", "", title + " (" + items.length + ")"));
  items.forEach((a) => list.appendChild(el("li", "", a)));
  d.appendChild(list);
  return d;
}

// Home: answered before she types.
let overview = null, health = null;            // overview: null loading, false failed
function renderHome() {
  const key = homeLang(), t = UI[key], nameKey = key === "gu" ? "gu" : "en";
  const first = home.querySelector(".wait");
  home.replaceChildren();
  if (overview) {
    const hero = el("div", first ? "hero chalk" : "hero");
    hero.appendChild(el("h2", "", t.heroTitle(overview.visit_first.length)));
    overview.visit_first.forEach((s, i) => {
      const row = el("button", "row " + s.priority), text = el("span", "grow"), top = el("span", "top");
      row.type = "button"; row.style.animationDelay = i / 8 + "s";
      top.append(el("b", "", s[nameKey]), el("span", "status", Q.tags[key][s.priority]));
      text.appendChild(top);
      const why = nameKey === "gu" ? s.why_gu : s.why_en;
      if (why && key !== "hi") text.appendChild(el("small", "", why));
      row.append(el("span", "sq", String(i + 1)), text, chev());
      row.addEventListener("click", () => askServer(aboutQuestion(s[nameKey], key), s.school_id, s[nameKey]));
      hero.appendChild(row);
    });
    const go = el("button", "btn", t.heroBtn);
    go.type = "button";
    go.addEventListener("click", () => askServer(Q.visit[key], null, t.heroBtn));
    hero.appendChild(go);
    // One square per school; the key says the same in words.
    const c = overview.counts, strip = el("div", "strip"), keyList = el("ul", "key");
    strip.setAttribute("aria-hidden", "true");
    [["High", c.High], ["Medium", c.Medium], ["Low", c.Low], ["", c.not_enough_data]].forEach(([p, n], i) => {
      for (let k = 0; k < n; k++) strip.appendChild(el("i", p));
      const li = el("li", p), words = el("span");
      words.append(el("b", "", String(n)), " " + t.stats[i]);
      li.append(el("i"), words);
      keyList.appendChild(li);
    });
    home.append(hero, el("h2", "section", t.allTitle(overview.schools_total, monthName(overview.month, t, "long", false))),
                strip, keyList);
  } else if (overview === null) {               // hold the space, so nothing jumps
    const wait = el("div", "hero wait");
    wait.setAttribute("aria-hidden", "true");
    wait.innerHTML = '<p class="skel"></p>'.repeat(6);
    home.appendChild(wait);
  } else {                                      // said out loud, never just missing
    const again = el("button", "chip", t.retry);
    again.type = "button";
    again.addEventListener("click", () => location.reload());
    home.append(el("p", "trust", t.offline), again);
  }
  home.appendChild(el("h2", "section", t.askAbout));
  const topics = el("div", "topics");
  Q.tiles[key].forEach((question, i) => {
    const b = el("button", "topic", t.tiles[i]);
    b.type = "button";
    b.addEventListener("click", () => askServer(question, null, t.tiles[i]));
    topics.appendChild(b);
  });
  home.append(topics, el("h2", "section", t.tryAsking));
  const list = el("div", "list");
  Q.examples[lang || "auto"].forEach((question) => {
    const b = el("button", "ex");
    b.type = "button"; b.lang = scriptOf(question);
    b.append(el("span", "", question), chev());
    b.addEventListener("click", () => askServer(question));
    list.appendChild(b);
  });
  home.append(list, el("p", "trust", t.trust));
  setBusy(busy);                               // a redraw while loading stays dimmed
}
function aboutQuestion(name, key) { return key === "gu" ? name + " વિશે જણાવો" : key === "hi" ? name + " के बारे में बताओ" : "Tell me about " + name; }

// Answers: the answer, a few reasons, what to do; the rest folded (D-034).
function renderCards(box, c, lead, t) {
  if (lead) box.appendChild(el("p", "lead", lead));
  if (c.note) box.appendChild(el("p", "sub", c.note));
  box.append(el("p", "headline", c.title), el("p", "sub", c.subtitle));
  c.schools.forEach((s, i) => {
    const card = el("div", "card school " + s.priority), head = el("div", "school-head"), meter = el("div", "meter");
    head.append(el("span", "sq", String(i + 1)), el("h3", "", s.name), el("span", "status", s.priority_label));
    meter.append(el("span", "", t.need), bar((100 * s.score) / s.score_scale), el("b", "", s.score + "/" + s.score_scale));
    const why = el("ul"), act = el("p", "do");
    s.reasons.forEach((r) => why.appendChild(el("li", "", r)));
    act.append(el("b", "", t.act + ": "), s.action);
    card.append(head, meter, why, act, el("p", "last", t.last + " " + s.last_visit));
    box.appendChild(card);
  });
  if (c.status) box.appendChild(el("p", "", c.status));
  (c.missing || []).forEach((m) => { const p = el("p", "gap"); p.append(el("i"), el("span", "", m)); box.appendChild(p); });
  if (c.also && c.also.length) box.appendChild(fold(c.also_title, c.also));
}
// Other answers: the WhatsApp text, laid out.
const ACTION = /^(Do|શું કરવું|करें|क्या करें)\s*:\s*/;
const MONTH = /^[^:,]{2,14}: ./;
function figure(line) { const pct = line.match(/^[^:]+: ([\d.]+)% (?:\(\d+\/\d+ |\/ )/); return pct && pct[1]; }
function trend(text) {                          // "Trend: June 45% → … (down 9 points since June)"
  const m = text.match(/^([^:]+): (.+?)(?: \(([^()]+)\))?$/), pts = m && m[2].split(" → ").map((p) => p.match(/^(.+) ([\d.]+)%$/));
  if (!pts || pts.length < 3 || !pts.every(Boolean)) return null;
  const li = el("li", "", m[1] + (m[3] ? ": " + m[3] : "")), cols = el("div", "cols");
  cols.setAttribute("role", "img"); cols.setAttribute("aria-label", m[2]);
  pts.forEach(([, mon, v]) => {
    const c = el("div"), col = el("span", "col"), fill = el("i");
    fill.style.height = 0.56 * v + "px";
    col.append(el("b", "", v + "%"), fill);
    c.append(col, el("small", "", /^[A-Z][a-z]{3,}$/.test(mon) ? mon.slice(0, 3) : mon));
    cols.appendChild(c);
  });
  li.appendChild(cols);
  return li;
}
function renderText(box, text, lead, t, folds) {
  const lines = text.split("\n").map((l) => l.trimEnd());
  // Months: lines with a figure, and their neighbours naming a month without one.
  const month = lines.map((l) => figure(l) !== null);
  for (let pass = 0; pass < 2; pass++) lines.forEach((l, i) => { if (MONTH.test(l) && (month[i - 1] || month[i + 1])) month[i] = true; });
  let list = null, grid = null, first = true, lists = 0;
  lines.forEach((line, i) => {
    if (!line.trim()) { list = grid = null; return; }
    if (lead && line === lead) { box.appendChild(el("p", "lead", line)); return; }      // the AI's line, then the title
    if (first) { box.appendChild(el("p", "headline", line)); first = false; return; }
    if (month[i]) {                             // the month, a bar, the same words
      if (!grid) { grid = el("div", "months"); box.appendChild(grid); }
      const at = line.indexOf(": "), v = figure(line), words = el("span", v === null ? "v wide" : "v", line.slice(at + 2));
      grid.append(el("span", "", line.slice(0, at)));
      if (v !== null) grid.appendChild(bar(+v));
      grid.appendChild(words);
      return;
    }
    grid = null;
    if (line.startsWith("• ")) {
      if (!list) { list = el("ul"); box.appendChild(list); lists++; }
      list.appendChild(trend(line.slice(2)) || el("li", "", line.slice(2)));
      return;
    }
    list = null;
    const m = line.match(ACTION);
    if (m) {
      const d = el("p", "do");
      d.append(el("b", "", t.act + ": "), line.slice(m[0].length));
      box.appendChild(d);
      return;
    }
    if (/^\d+\.\s/.test(line)) { box.appendChild(el("p", "item", line)); lists++; return; }
    if (/^\s{2,}/.test(line)) { box.appendChild(el("p", "indent", line.trim())); return; }
    if (line.endsWith(":") && line.length < 70) {
      let n = 0;
      while (lines[i + 1 + n] && lines[i + 1 + n].startsWith("• ")) n++;
      if (folds && lists && n) {                // a later list: folded
        const d = el("details", "more");
        d.appendChild(el("summary", "", line.slice(0, -1) + " (" + n + ")"));
        list = el("ul");
        d.appendChild(list);
        box.appendChild(d);
        return;
      }
      box.appendChild(el("p", "subhead", line));
      return;
    }
    box.appendChild(el("p", "", line));
  });
}
// How each answer was made.
function describe(check, t) {
  if (check.rejected) {
    const found = (check.unsupported || []).concat(check.number_words || []).join(", ");
    return [found ? t.rejectedNum(found) : t.rejectedOther, "bad"];
  }
  if (check.ai_used) return [t.aiUsed, ""];
  if (check.ai_paused) return [t.paused, "warn"];
  if (check.error) return [t.unavailable, "warn"];
  return [t.checked, ""];
}
function chips(box, options) {
  if (!options || !options.length) return;
  const row = el("div", "actions");
  options.forEach((o) => {
    const c = el("button", "chip", o.label);
    c.type = "button";
    c.addEventListener("click", () => askServer(o.question, o.school_id, o.shown || o.label));
    row.appendChild(c);
  });
  box.appendChild(row);
}

let busy = false;
function setBusy(on) {                         // one answer at a time
  busy = send.disabled = on;
  chat.querySelectorAll("#home button, .chip:not(.ghost)").forEach((b) => b.setAttribute("aria-disabled", on));
}
async function askServer(question, schoolId, shown) {
  question = (question || "").trim();
  if (!question || busy) return;
  setBusy(true);
  const tk = uiKey(scriptOf(question)), t = UI[tk];
  const q = el("div", "q"); q.lang = scriptOf(shown || question); q.appendChild(el("span", "", shown || question)); thread.appendChild(q);
  const answer = el("div", "a"), wait = el("div", "loading"), dots = el("span", "dots");
  answer.lang = tk;
  answer.setAttribute("aria-busy", "true");
  dots.append(el("i"), el("i"), el("i"));
  const note = el("span", "", t.loading);
  wait.append(dots, note);
  answer.appendChild(wait); thread.appendChild(answer);
  chat.scrollTop = q.offsetTop - chat.offsetTop - 8;
  const slow = setTimeout(() => { note.textContent = t.slow; }, 6000);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);   // longer than the server's worst case
  try {
    const res = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ question, lang: lang || null, school_id: schoolId || null, test_checker: test.checked }),
    });
    answer.replaceChildren();
    if (res.status === 429) return retry(answer, t.tooMany, t, question, schoolId, shown);
    if (!res.ok) return retry(answer, t.failed(res.status), t, question, schoolId, shown);
    const r = await res.json(), rk = uiKey(r.lang), tr = UI[rk];
    answer.lang = r.lang;
    let [meta, cls] = describe(r.check || {}, tr);
    if (test.checked && r.check && (r.check.test_checker === false || r.check.error)) { meta = "(Number-checker test: the AI is off.) " + meta; cls = "warn"; }
    const metaEl = el("p", "meta " + cls, (cls ? "" : "✓ ") + meta), row = el("div", "actions"), copy = el("button", "chip ghost", tr.copy);
    metaEl.lang = row.lang = rk;
    if (cls) answer.appendChild(metaEl);                         // warnings first, where they are seen
    if (r.cards) renderCards(answer, r.cards, r.lead, UI[r.lang] || tr); else renderText(answer, r.text, r.lead, UI[r.lang] || tr, r.intent !== "top_priority_schools");
    if (!cls) answer.appendChild(metaEl);
    copy.type = "button";
    copy.addEventListener("click", () => {      // the whole text, for WhatsApp
      if (navigator.clipboard) navigator.clipboard.writeText(r.text).then(() => { copy.textContent = "✓ " + tr.copied; }, () => {});
    });
    row.appendChild(copy);
    answer.appendChild(row);
    if (r.options && r.options.length) { const next = el("p", "label", tr.next); next.lang = rk; answer.appendChild(next); }
    chips(answer, r.options);
  } catch (e) {
    answer.replaceChildren();
    retry(answer, t.offline, t, question, schoolId, shown);
  } finally {
    clearTimeout(timer); clearTimeout(slow); setBusy(false);
    answer.removeAttribute("aria-busy");
    chat.scrollTop = q.offsetTop - chat.offsetTop - 8;          // the question on top, its answer below
  }
}
function retry(answer, message, t, question, schoolId, shown) {
  answer.appendChild(el("p", "meta warn", message));
  chips(answer, [{ label: t.retry, question, school_id: schoolId, shown: shown || question }]);
}

// Language, header, start.
function setLang(value, announce) {
  lang = value;
  try { localStorage.setItem("saathi-lang", value); } catch (e) { /* storage blocked */ }
  pick.value = value;
  const key = homeLang(), h = UI[key];
  document.documentElement.lang = key;          // for screen readers
  $("any").textContent = h.any;
  pick.setAttribute("aria-label", h.pickLabel);
  $("qlabel").textContent = h.qLabel;
  send.setAttribute("aria-label", h.sendLabel);
  box.placeholder = h.placeholder;
  if (health) $("sub").textContent = h.sub(health.schools, monthName(health.latest_month, h, "short"));
  renderHome();
  if (!announce || !thread.childElementCount) return;
  const note = el("p", "meta");
  if (UI[lang]) note.textContent = UI[lang].switched;
  else { const gu = el("span", "", "જવાબ તમારા પ્રશ્નની ભાષામાં આવશે."); gu.lang = "gu"; note.append(gu, " / Replies follow the language you ask in."); }
  thread.appendChild(note);
}
pick.addEventListener("change", () => setLang(pick.value, true));

form.addEventListener("submit", (e) => { e.preventDefault(); if (busy) return; const v = box.value; box.value = ""; grow(); askServer(v); });
box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
function grow() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 120) + "px"; }
box.addEventListener("input", grow);

// ?q=...&lang=gu asks on opening.
const params = new URLSearchParams(location.search);
let saved = "";
try { saved = localStorage.getItem("saathi-lang") || ""; } catch (e) { /* storage blocked */ }
const LANGS = ["", "en", "gu", "hi"];
setLang(LANGS.includes(params.get("lang")) ? params.get("lang") : LANGS.includes(saved) ? saved : "", false);
if (params.get("test") === "1") { test.checked = true; review.open = true; }
if (params.get("review") === "1") review.open = true;

Promise.all([
  fetch("/overview").then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((o) => { overview = o; })
    .catch(() => { overview = false; }),
  fetch("/health").then((r) => r.json()).then((h) => { health = h; statusEl.textContent = h.llm ? "AI: on" : "AI: off (rules only)"; })
    .catch(() => { statusEl.textContent = "offline?"; }),
]).then(() => {
  setLang(lang, false);
  if (params.get("q")) askServer(params.get("q").slice(0, 500));
});
</script>
